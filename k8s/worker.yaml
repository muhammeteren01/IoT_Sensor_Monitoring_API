apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -qO- http://api:8080/health; do echo waiting for api; sleep 3; done
      containers:
        - name: worker
          image: iot-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iot-config
            - secretRef:
                name: iot-secrets
