services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot_sensor_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_sensor_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: iot-api:local
    container_name: iot-api
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Istanbul
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=iot_sensor_monitoring;Username=iot;Password=iot
      JwtSettings__Secret: sLronozEdhWeNwQFnFL6stpfVeVKASVKEOI4lzdMoIA
      SeedSettings__Enabled: "true"
      SeedSettings__Email: admin@iot.local
      SeedSettings__Password: Admin123!
      SeedSettings__FirstName: Super
      SeedSettings__LastName: Admin
      GrafanaSettings__Enabled: "true"
      GrafanaSettings__InternalUrl: http://grafana:3000
      GrafanaSettings__AdminUser: admin
      GrafanaSettings__AdminPassword: admin
      GrafanaSettings__ClientId: grafana
      GrafanaSettings__ClientSecret: xwovJHQ9abUg70UaBbxhAWsV6g6gMCQSpWNOv7PGE9c
      GrafanaSettings__RedirectUris: http://localhost:3000/login/generic_oauth
      GrafanaSettings__PostgresHost: postgres
      GrafanaSettings__PostgresPort: "5432"
      GrafanaSettings__PostgresDatabase: iot_sensor_monitoring
      GrafanaSettings__RolePasswordSecret: IoTSensorMonitoring_DevJwtSecret_ChangeMe_32
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  worker:
    image: iot-worker:local
    container_name: iot-worker
    environment:
      TZ: Europe/Istanbul
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=iot_sensor_monitoring;Username=iot;Password=iot
      WorkerSettings__IntervalSeconds: "10"
      WorkerSettings__CalibrationWarningDays: "7"
      WorkerExecution__Mode: ApiIntegration
      IntegrationSettings__IntervalSeconds: "10"
      IntegrationSettings__CalibrationWarningDays: "7"
      IntegrationSettings__ApiBaseUrl: http://api:8080
      IntegrationSettings__LocalStorePath: /app/data/worker-queue.db
      IntegrationSettings__MaxFlushAttempts: "10"
      IntegrationSettings__Clients__0__ClientId: ${INTEGRATION_CLIENT_ID:-}
      IntegrationSettings__Clients__0__ClientSecret: ${INTEGRATION_CLIENT_SECRET:-}
    volumes:
      - ./localdb:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: iot-grafana:local
    container_name: iot-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/iot-monitoring.json
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: PulseGrid
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: xwovJHQ9abUg70UaBbxhAWsV6g6gMCQSpWNOv7PGE9c
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:8080/oauth/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://api:8080/oauth/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://api:8080/oauth/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: login
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: role
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "true"
      GF_AUTH_OAUTH_SKIP_ORG_ROLE_UPDATE_SYNC: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "grafana cli admin reset-admin-password admin || true; exec /run.sh"
    restart: unless-stopped

  ui:
    image: iot-ui:local
    container_name: iot-ui
    ports:
      - "4040:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
